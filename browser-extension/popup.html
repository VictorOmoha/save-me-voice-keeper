<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaveMe.Space</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0f1e;
      color: #e2e8f0;
      font-size: 13px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid #1e2a3a;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .logo-text {
      font-size: 14px;
      font-weight: 600;
      color: #f1f5f9;
    }

    .logo-sub {
      font-size: 10px;
      color: #64748b;
    }

    .auth-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 20px;
      border: 1px solid #1e2a3a;
      cursor: pointer;
    }

    .auth-badge.logged-in {
      color: #4ade80;
      border-color: rgba(74, 222, 128, 0.2);
    }

    .auth-badge.logged-out {
      color: #94a3b8;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .dot.green { background: #4ade80; }
    .dot.gray { background: #475569; }

    /* Main form */
    .form-area {
      padding: 16px;
    }

    .field-group {
      margin-bottom: 12px;
    }

    .field-label {
      font-size: 11px;
      font-weight: 500;
      color: #64748b;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input, textarea {
      width: 100%;
      background: #111827;
      border: 1px solid #1e2a3a;
      border-radius: 8px;
      padding: 9px 12px;
      color: #e2e8f0;
      font-size: 13px;
      font-family: inherit;
      transition: border-color 0.15s;
      outline: none;
      resize: none;
    }

    input:focus, textarea:focus {
      border-color: #3b82f6;
    }

    input::placeholder, textarea::placeholder {
      color: #334155;
    }

    textarea {
      height: 80px;
      line-height: 1.5;
    }

    /* Category preview */
    .category-preview {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: #111827;
      border: 1px solid #1e2a3a;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .category-preview:hover {
      border-color: #3b82f6;
    }

    .category-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3b82f6;
      flex-shrink: 0;
    }

    .category-name {
      flex: 1;
      color: #e2e8f0;
    }

    .category-nova {
      font-size: 10px;
      color: #3b82f6;
      background: rgba(59, 130, 246, 0.1);
      padding: 2px 6px;
      border-radius: 10px;
    }

    /* Actions */
    .actions {
      display: flex;
      gap: 8px;
      padding: 0 16px 16px;
    }

    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: #111827;
      color: #94a3b8;
      border: 1px solid #1e2a3a;
    }

    .btn-secondary:hover:not(:disabled) {
      color: #e2e8f0;
      border-color: #334155;
    }

    /* Success / error states */
    .feedback {
      margin: 0 16px 16px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      display: none;
    }

    .feedback.success {
      background: rgba(74, 222, 128, 0.1);
      border: 1px solid rgba(74, 222, 128, 0.2);
      color: #4ade80;
    }

    .feedback.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #f87171;
    }

    .feedback-title {
      font-weight: 600;
      margin-bottom: 3px;
    }

    .feedback-sub {
      font-size: 11px;
      opacity: 0.8;
    }

    /* Footer shortcuts */
    .footer {
      border-top: 1px solid #1e2a3a;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .shortcut-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #475569;
    }

    kbd {
      background: #1e2a3a;
      border: 1px solid #334155;
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 10px;
      font-family: monospace;
    }

    .btn-nova {
      background: transparent;
      border: 1px solid #1e2a3a;
      color: #64748b;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-nova:hover {
      border-color: #3b82f6;
      color: #3b82f6;
    }

    /* Loading spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    /* Not authenticated state */
    .auth-required {
      padding: 24px 16px;
      text-align: center;
      display: none;
    }

    .auth-required .icon { font-size: 32px; margin-bottom: 10px; }
    .auth-required h3 { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .auth-required p { font-size: 12px; color: #64748b; margin-bottom: 16px; line-height: 1.5; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo-area">
      <div class="logo">✨</div>
      <div>
        <div class="logo-text">SaveMe.Space</div>
        <div class="logo-sub">Quick Capture</div>
      </div>
    </div>
    <div class="auth-badge" id="authBadge">
      <div class="dot gray" id="authDot"></div>
      <span id="authLabel">Checking...</span>
    </div>
  </div>

  <!-- Save Form (shown when authenticated) -->
  <div id="saveForm">
    <div class="form-area">
      <div class="field-group">
        <div class="field-label">Title</div>
        <input type="text" id="titleInput" placeholder="What is this?" maxlength="200" />
      </div>

      <div class="field-group">
        <div class="field-label">Content</div>
        <textarea id="contentInput" placeholder="Notes, quotes, links, anything..."></textarea>
      </div>

      <div class="field-group">
        <div class="field-label">Category · Nova predicts</div>
        <div class="category-preview" id="categoryPreview">
          <div class="category-dot" id="categoryDot"></div>
          <span class="category-name" id="categoryName">Detecting...</span>
          <span class="category-nova" id="categoryNovaTag" style="display:none">Nova</span>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="saveBtn">
        <span id="saveBtnContent">💾 Save to Vault</span>
      </button>
      <button class="btn btn-secondary" id="openBtn" title="Open SaveMe.Space">↗</button>
    </div>

    <div class="feedback" id="feedback">
      <div class="feedback-title" id="feedbackTitle"></div>
      <div class="feedback-sub" id="feedbackSub"></div>
    </div>
  </div>

  <!-- Not authenticated state -->
  <div class="auth-required" id="authRequired">
    <div class="icon">🔐</div>
    <h3>Sign in to capture</h3>
    <p>Open SaveMe.Space and sign in. The extension will pick up your session automatically.</p>
    <button class="btn btn-primary" id="loginBtn">Open SaveMe.Space</button>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="shortcut-row">
      <kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>S</kbd>
      <span>Quick save</span>
    </div>
    <button class="btn-nova" id="novaBtn">🎤 Nova</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
