<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E0E7FF"/>
    </linearGradient>
  </defs>
  <!-- Shield shape -->
  <path d="M256 28 L462 120 C462 120 472 320 256 488 C40 320 50 120 50 120 Z" fill="url(#shieldGrad)" stroke="none"/>
  <!-- Inner shield highlight -->
  <path d="M256 56 L436 138 C436 138 444 312 256 460 C68 312 76 138 76 138 Z" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>
  <!-- Microphone body -->
  <rect x="224" y="140" width="64" height="120" rx="32" fill="url(#micGrad)"/>
  <!-- Microphone arc -->
  <path d="M192 240 C192 290 220 320 256 320 C292 320 320 290 320 240" fill="none" stroke="white" stroke-width="16" stroke-linecap="round"/>
  <!-- Microphone stand -->
  <line x1="256" y1="320" x2="256" y2="370" stroke="white" stroke-width="16" stroke-linecap="round"/>
  <!-- Microphone base -->
  <line x1="216" y1="370" x2="296" y2="370" stroke="white" stroke-width="16" stroke-linecap="round"/>
</svg>
