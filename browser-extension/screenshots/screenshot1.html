<!DOCTYPE html>
<html>
<head>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1280px; height: 800px; background: linear-gradient(135deg, #0a0a1a 0%, #0d1b2a 50%, #1b2838 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.container { text-align: center; max-width: 900px; }
.badge { display: inline-block; background: rgba(0,180,255,0.15); color: #00b4ff; padding: 8px 20px; border-radius: 20px; font-size: 14px; margin-bottom: 30px; border: 1px solid rgba(0,180,255,0.3); }
h1 { font-size: 56px; font-weight: 700; line-height: 1.2; margin-bottom: 20px; }
h1 span { color: #00b4ff; }
p.sub { font-size: 22px; color: #8899aa; margin-bottom: 40px; line-height: 1.5; }
.mic-area { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.mic-btn { width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, #1a2a3a, #0d1b2a); border: 2px solid rgba(0,180,255,0.4); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 40px rgba(0,180,255,0.2); }
.mic-btn svg { width: 50px; height: 50px; }
.mic-label { color: #556677; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; }
.hotkey { display: inline-block; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 6px 16px; font-size: 16px; color: #aabbcc; margin-top: 24px; }
.hotkey kbd { background: rgba(0,180,255,0.15); color: #00b4ff; padding: 3px 10px; border-radius: 4px; font-family: inherit; }
.logo { position: absolute; top: 30px; left: 40px; display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 600; }
.logo img { width: 36px; height: 36px; border-radius: 8px; }
</style>
</head>
<body>
<div class="logo">
  <img src="https://saveme.space/logo.png" alt="SaveMe.Space">
  SaveMe Voice Keeper
</div>
<div class="container">
  <div class="badge">✨ Chrome Extension</div>
  <h1>Capture thoughts<br><span>with your voice</span></h1>
  <p class="sub">Press Ctrl+Space anywhere in Chrome to instantly start<br>a brain dump. AI organizes everything for you.</p>
  <div class="mic-area">
    <div class="mic-btn">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
        <defs><linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#3b82f6"/><stop offset="100%" style="stop-color:#06b6d4"/></linearGradient></defs>
        <circle cx="64" cy="48" r="12" fill="white"/>
        <path d="M76 52v12c0 6.63-5.37 12-12 12s-12-5.37-12-12V52" stroke="white" stroke-width="6" fill="none" stroke-linecap="round"/>
        <line x1="64" y1="76" x2="64" y2="96" stroke="white" stroke-width="6" stroke-linecap="round"/>
      </svg>
    </div>
    <span class="mic-label">Tap to start</span>
  </div>
  <div class="hotkey">Global Hotkey: <kbd>Ctrl</kbd> + <kbd>Space</kbd></div>
</div>
</body>
</html>
