<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #334155;
    }
    
    .logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    
    .title {
      font-size: 16px;
      font-weight: 600;
      margin: 0;
    }
    
    .subtitle {
      font-size: 12px;
      color: #94a3b8;
      margin: 0;
    }
    
    .shortcut {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .shortcut-label {
      font-size: 13px;
      color: #cbd5e1;
    }
    
    .shortcut-key {
      background: #334155;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-family: monospace;
      font-weight: 600;
    }
    
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    
    button:hover {
      opacity: 0.9;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      color: white;
      margin-bottom: 8px;
    }
    
    .btn-secondary {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
    }
    
    .status {
      margin-top: 12px;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      text-align: center;
    }
    
    .status.ready {
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
    }
    
    .tips {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #334155;
    }
    
    .tips-title {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #94a3b8;
    }
    
    .tip {
      font-size: 11px;
      color: #64748b;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🎤</div>
    <div>
      <h1 class="title">SaveMe</h1>
      <p class="subtitle">Voice-powered capture</p>
    </div>
  </div>
  
  <div class="shortcut">
    <span class="shortcut-label">Global Hotkey</span>
    <span class="shortcut-key">Ctrl + Space</span>
  </div>
  
  <button id="captureBtn" class="btn-primary">
    🎯 Start Brain Dump
  </button>
  
  <button id="dashboardBtn" class="btn-secondary">
    📊 Open Dashboard
  </button>
  
  <div class="status ready">
    ✓ Extension active — Press Ctrl+Space anywhere
  </div>
  
  <div class="tips">
    <div class="tips-title">PRO TIPS</div>
    <div class="tip">• Press Ctrl+Space from any tab</div>
    <div class="tip">• Right-click text → "Save to SaveMe"</div>
    <div class="tip">• Voice transcribes automatically</div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
