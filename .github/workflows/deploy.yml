name: Deploy Firebase release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_CLOUD_FUNCTIONS_URL: ${{ secrets.VITE_CLOUD_FUNCTIONS_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Require production client env
        run: node scripts/assert-production-env.mjs

      - name: Build
        run: npm run build

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Verify release
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm --prefix functions test
          npm run test:extension
          npm audit --audit-level=high
          npm --prefix functions audit --audit-level=high

      - name: Authenticate deployment
        uses: google-github-actions/auth@v3
        with:
          project_id: saveme-f5af0
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SAVEME_F5AF0 }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Preserve runtime configuration
        env:
          STRIPE_MODE: ${{ vars.STRIPE_MODE }}
          STRIPE_LIVE_BASIC_MONTHLY_PRICE_ID: ${{ vars.STRIPE_LIVE_BASIC_MONTHLY_PRICE_ID }}
          STRIPE_LIVE_PREMIUM_MONTHLY_PRICE_ID: ${{ vars.STRIPE_LIVE_PREMIUM_MONTHLY_PRICE_ID }}
        run: |
          umask 077
          gcloud functions describe createCheckout --region us-central1 --project saveme-f5af0 --format=json > "$RUNNER_TEMP/runtime.json"
          node scripts/prepare-production-functions-env.mjs "$RUNNER_TEMP/runtime.json"

      - name: Deploy Cloud Functions and security rules
        run: npx firebase deploy --only functions,firestore:rules,storage --project saveme-f5af0 --non-interactive

      - name: Deploy Hosting
        run: npx firebase deploy --only hosting --project saveme-f5af0 --non-interactive
